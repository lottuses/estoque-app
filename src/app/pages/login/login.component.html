<section class="login">
    <div class="login-dec">
        <div class="login-dec-content">

            <div class="logo">
                <img src="../../../assets/login/logo.png" alt="">
            </div>

            <div class="footer">
                <div class="socials">
                    <a href="#"><img src="../../../assets/login/igsvg.svg" alt=""></a>
                    <a href="#"><img src="../../../assets/login/ytbsvg.svg" alt=""></a>
                    <a href="#"><img src="../../../assets/login/wppsvg.svg" alt=""></a>
                </div>

                <button class="support-btn">Suporte</button>
            </div>

        </div>
    </div>

    <div class="login-main">
        <div class="login-box">
            <h2>Entrar</h2>

            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Digite seu email">
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Digite sua senha">
                </div>

                <button class="login-btn">Entrar</button>
            </form>
        </div>
    </div>
</section>
