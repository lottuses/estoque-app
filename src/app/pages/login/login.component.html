<ion-content [fullscreen]="true">


    <div class="page">
        <div class="main">

            <input type="checkbox" id="chk" aria-hidden="true">

            <!-- LOGIN -->
            <div class="login">

                <form (ngSubmit)="login()">

                    <label class="title" for="chk">
                        Login
                    </label>

                    <div class="input-field">

                        <input type="email" autocomplete="email" name="loginEmail" required placeholder=" " [(ngModel)]="loginEmail">

                        <label>Email</label>

                    </div>

                    <div class="input-field">

                        <input type="password" autocomplete="current-password" name="loginSenha" required placeholder=" " [(ngModel)]="loginSenha">

                        <label>Senha</label>

                    </div>

                    <button type="submit" [disabled]="carregando">

                        {{ carregando ? 'Carregando...' : 'Login' }}

                    </button>

                </form>

            </div>

            <!-- CADASTRO -->
            <div class="signup">

                <form (ngSubmit)="cadastrar()">

                    <label class="title" for="chk">
                        Cadastro
                    </label>

                    <div class="input-field">

                        <input type="email" name="cadastroEmail" required placeholder=" " [(ngModel)]="cadastroEmail">

                        <label>Email</label>

                    </div>

                    <div class="input-field">

                        <input type="password" autocomplete="new-password" name="cadastroSenha" required placeholder=" "
                            [(ngModel)]="cadastroSenha">

                        <label>Senha</label>

                    </div>

                    <button type="submit" [disabled]="carregando">

                        {{ carregando ? 'Criando conta...' : 'Cadastrar' }}

                    </button>

                </form>

            </div>

        </div>
    </div>

</ion-content>
