<ion-content [fullscreen]="true">

    <section class="dashboard">

        <!-- HEADER -->
        <header class="headertop">

            <div class="headline">

                <div class="inner">

                    <h1>DASHBOARD</h1>
                    <p>Olá</p>

                </div>

            </div>

        </header>


        <!-- SIDEBAR -->
        <aside class="dashboard-sidebar">

            <!-- BOTÃO ABRIR -->
            <button class="btn-show-nav" *ngIf="!menuAberto" (click)="toggleMenu()">

                <i class="fas fa-bars"></i>

            </button>

            <!-- OVERLAY -->
            <div class="sidebar-overlay" *ngIf="menuAberto" (click)="toggleMenu()">
            </div>

            <!-- MENU -->
            <nav class="sidebar-nav" [class.open]="menuAberto">

                <!-- TOPO -->
                <div class="sidebar-header">

                    <div class="sidebar-logo">
                        FG
                    </div>

                    <div class="sidebar-user">

                        <h2>
                            Ferragens Gener
                        </h2>

                        <p>
                            Painel administrativo
                        </p>

                    </div>

                    <button class="btn-hide-nav" (click)="toggleMenu()">

                        <i class="fas fa-times"></i>

                    </button>

                </div>

                <!-- LINKS -->
                <ul class="nav-list">

                    <li class="nav-item">

                        <a routerLink="/dashboard/infos" routerLinkActive="active" class="nav-link"
                            (click)="toggleMenu()">

                            <i class="fas fa-home"></i>

                            <span>
                                Informações
                            </span>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a routerLink="/dashboard/estoque" routerLinkActive="active" class="nav-link"
                            (click)="toggleMenu()">

                            <i class="fas fa-box"></i>

                            <span>
                                Estoque
                            </span>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a routerLink="/dashboard/financeiro" routerLinkActive="active" class="nav-link"
                            (click)="toggleMenu()">

                            <i class="fas fa-dollar-sign"></i>

                            <span>
                                Financeiro
                            </span>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a routerLink="/dashboard/pedidos" routerLinkActive="active" class="nav-link"
                            (click)="toggleMenu()">

                            <i class="fas fa-newspaper"></i>

                            <span>
                                Pedidos
                            </span>

                        </a>

                    </li>

                    <li class="nav-item">

                        <a routerLink="/dashboard/orcamento" routerLinkActive="active" class="nav-link"
                            (click)="toggleMenu()">

                            <i class="fas fa-file-invoice"></i>

                            <span>
                                Orçamentos
                            </span>

                        </a>

                    </li>

                </ul>

                <!-- FOOTER -->
                <div class="sidebar-footer">

                    <button class="botaosair" (click)="logout()">

                        <i class="fas fa-sign-out-alt"></i>

                        Sair

                    </button>

                </div>

            </nav>

        </aside>

        <!-- CONTEÚDO -->
        <div class="dashboard-content">

            <router-outlet></router-outlet>

        </div>

    </section>

</ion-content>
